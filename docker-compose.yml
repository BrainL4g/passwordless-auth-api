services:
  db:
    image: postgres:16-alpine
    container_name: passwordless-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт публикуется, чтобы alembic/pytest могли обращаться к PostgreSQL с хоста.
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-auth} -d ${POSTGRES_DB:-auth}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - authnet

  redis:
    image: redis:7-alpine
    container_name: passwordless-auth-redis
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - authnet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: passwordless-auth-api:latest
    container_name: passwordless-auth-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth}@db:5432/${POSTGRES_DB:-auth}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - authnet

volumes:
  pgdata:
    driver: local

networks:
  authnet:
    driver: bridge
