[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passwordless-auth-api"
version = "1.0.0"
description = "Backend API для беспарольной аутентификации WebAuthn/Passkeys"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "SQLAlchemy>=2.0.35",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.0",
    "PyJWT>=2.9.0",
    "webauthn>=2.7.0,<3.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

# --------------------------------------------------------------------------- black
[tool.black]
line-length = 100
target-version = ["py312"]

# --------------------------------------------------------------------------- isort
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "tests"]
skip = ["alembic/versions", ".venv"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_decorators = false
mypy_path = "."
explicit_package_bases = false
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "env", "script"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
warn_return_any = false
disallow_untyped_defs = true
disallow_untyped_decorators = false

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config -p no:cacheprovider"
markers = [
    "integration: тесты, требующие настоящей базы данных PostgreSQL",
]
filterwarnings = [
    "error::DeprecationWarning:src.*",
]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
